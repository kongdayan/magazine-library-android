name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v1.4.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Unsupported tag: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          yes | "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate translations
        run: python3 scripts/check-translations.py

      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain

      - name: Build release APKs
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: ./gradlew :app:assembleRelease -PversionName="$VERSION" --console=plain

      - name: Assemble release directory
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 - "$VERSION" "$TAG" <<'PY'
          import hashlib, json, pathlib, shutil, sys
          version, tag = sys.argv[1], sys.argv[2]
          source = pathlib.Path("app/build/outputs/apk/release")
          output = pathlib.Path("dist")
          output.mkdir(exist_ok=True)
          variants = {
              "universal": "universal",
              "arm64-v8a": "arm64-v8a",
              "armeabi-v7a": "armeabi-v7a",
              "x86_64": "x86_64",
          }
          files = []
          for abi, suffix in variants.items():
              origin = source / f"app-{suffix}-release.apk"
              if not origin.exists():
                  raise SystemExit(f"missing {origin}")
              target = output / f"MagazineLibrary-{abi}.apk"
              shutil.copy2(origin, target)
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              files.append({
                  "name": target.name,
                  "abi": abi,
                  "bytes": target.stat().st_size,
                  "sha256": digest,
              })
          (output / "SHA256SUMS").write_text(
              "".join(f"{item['sha256']}  {item['name']}\n" for item in files),
              encoding="utf-8",
          )
          (output / "release.json").write_text(
              json.dumps({"version": version, "tag": tag,
                          "commit": __import__("os").environ.get("GITHUB_SHA", ""),
                          "files": files}, indent=2) + "\n",
              encoding="utf-8",
          )
          print((output / "SHA256SUMS").read_text())
          PY

      - name: Verify release signing
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            dist/MagazineLibrary-universal.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging \
            dist/MagazineLibrary-universal.apk | grep -E 'package:|sdkVersion|targetSdkVersion'

      - name: Write release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python3 scripts/release-notes.py "$TAG" > dist/RELEASE_NOTES.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*.apk'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS dist/release.json --clobber
          else
            gh release create "$TAG" \
              dist/*.apk dist/SHA256SUMS dist/release.json \
              --title "Magazine Library $VERSION" \
              --notes-file dist/RELEASE_NOTES.md \
              --verify-tag
          fi
