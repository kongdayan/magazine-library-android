name: Feature request
description: Suggest a change that fits the app's focus
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Magazine Library is deliberately small: no accounts, no ads, no analytics, no cloud.
        Requests that keep it local and dependency-free are easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Discover
        - Library
        - Downloads
        - Reader
        - Settings / accessibility
        - Localization
        - Documentation
        - Other
    validations:
      required: true
