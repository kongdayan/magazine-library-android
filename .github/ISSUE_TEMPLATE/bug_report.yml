name: Bug report
description: Report a reproducible problem with the app or a release
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste cookies, account data or private documents.
        Security issues belong in a private advisory, not a public issue.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings → About, for example 1.4.0 (10400)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: HONOR BVL-AN20, Android 15
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Discover / search
        - Library
        - Downloads
        - PDF reader
        - Settings / language
        - About / update check
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Discover
        2. Search for ...
        3. Tap ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include the exact message and whether a verification page appeared.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Screenshots of the page are useful if they contain no personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am using the latest release.
          required: true
        - label: This report contains no cookies, tokens or copyrighted files.
          required: true
